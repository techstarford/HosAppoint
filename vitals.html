<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HosAppoint – My Vitals</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="vitals">
    <div class="app">
        <aside id="sidebar"></aside>
        <main>
            <header>
                <h1>My Vitals</h1><button class="logout" id="logout">Logout</button>
            </header>
            <table>
                <tr>
                    <th>Blood Pressure</th>
                    <td>120/80 mmHg</td>
                </tr>
                <tr>
                    <th>Heart Rate</th>
                    <td>72 bpm</td>
                </tr>
                <tr>
                    <th>Temperature</th>
                    <td>36.6 °C</td>
                </tr>
                <tr>
                    <th>Weight</th>
                    <td>68 kg</td>
                </tr>
            </table>
            <p style="font:12px Arial">Sample data for demonstration.</p>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
