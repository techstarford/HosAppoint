<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HosAppoint – Login</title><link rel="stylesheet" href="style.css"></head>
<body data-page="login"><div class="login">
<div id="logo"></div><p>Sign in To HosAppoint</p>
<form id="loginForm" novalidate>
<label>Email:</label><input id="email" type="email" placeholder="Enter your email"><div class="err" data-for="email"></div>
<label>Password:</label><div class="pw"><input id="password" type="password" placeholder="Enter your password"><button type="button" id="eye" aria-label="Show password">&#128065;</button></div><div class="err" data-for="password"></div>
<div style="text-align:center"><button class="btn cyan" type="submit">LOGIN</button></div></form>
<button class="google" id="google">Sign in with Google</button>
</div><script src="app.js"></script></body></html>
